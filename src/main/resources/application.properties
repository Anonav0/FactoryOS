# Application Name
spring.application.name=FactoryOS

# Server Port
server.port=${SERVER_PORT:8080}

# PostgreSQL Datasource Configuration using Environment Variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/factoryos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Springdoc / Swagger UI Configuration
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# FactoryOS Production Hardening Properties
factoryos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Active Profiles (dev by default for demonstration data)
spring.profiles.default=dev
