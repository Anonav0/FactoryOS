# Production Profile Configuration for FactoryOS

# Server Port
server.port=${SERVER_PORT:8080}

# Production Datasource (Credentials supplied via environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production JPA / Hibernate: Validate database schema rather than altering it
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production Swagger / OpenAPI: Disabled by default for security
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Production Logging: High-signal logging without verbose SQL formatting
logging.level.root=INFO
logging.level.com.factoryos=INFO
logging.level.org.hibernate.SQL=WARN

